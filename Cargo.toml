[package]
name = "winisle"
version = "0.1.0"
edition = "2021"
description = "WinIsle — 原创开源的 Windows 灵动岛桌面音乐伴侣"
license = "MIT"
repository = "https://github.com/long-mf/WinIsle"
authors = ["WinIsle contributors"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6"
tray-icon = "0.19"
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Devices_Geolocation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs", "json", "gzip"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
