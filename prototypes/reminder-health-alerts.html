<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WinIsle · 健康提醒三款（柔光呼吸 · 快频）</title>
<style>
:root{--paper:#f1ece1;--card:#fbf8f1;--ink:#E9ECF2;--muted:#969EAF;--muted2:#6B7180}
*{box-sizing:border-box}
body{margin:0;padding:52px 54px 64px;color:#2b2a26;
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 18% -10%,#f8f3e8 0%,var(--paper) 55%,#e9e2d3 100%)}
.eyebrow{font-size:12px;letter-spacing:.22em;color:#9a8f78;font-weight:700;text-transform:uppercase}
h1{font-size:33px;margin:8px 0 8px;font-weight:800;letter-spacing:-.01em}
.sub{font-size:14.5px;color:#6f6a5e;line-height:1.7;max-width:900px}
.sub b{color:#2b2a26}
.badge{display:inline-block;margin-top:12px;font-size:12px;font-weight:800;color:#1c7a52;
  background:#e7f6ee;border:1px solid #c9ead9;padding:4px 11px;border-radius:99px}

.rows{margin-top:34px;display:flex;flex-direction:column;gap:26px}
.row{display:grid;grid-template-columns:250px 560px;gap:34px;align-items:start;
  background:var(--card);border:1px solid #e4dccb;border-radius:20px;padding:20px 22px;
  box-shadow:0 18px 40px -30px rgba(60,48,20,.5)}
.meta .no{width:26px;height:26px;border-radius:8px;background:#2b2a26;color:#f6f1e5;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.meta h3{font-size:17px;margin:11px 0 4px;font-weight:800}
.meta .d{font-size:12.5px;color:#7a745f;line-height:1.6}
.dot{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11.5px;color:#6b6455}
.dot i{width:11px;height:11px;border-radius:50%;display:inline-block}
.meta .kv{margin-top:12px;font-size:11.5px;color:#8b836d;line-height:1.7}
.meta .kv b{color:#4b4638}

/* 岛体 */
.stage{width:520px;height:300px;position:relative;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#21232c,#16171c);
  box-shadow:0 26px 44px -26px rgba(10,12,18,.75)}
.rail{position:absolute;left:0;top:0;width:66px;bottom:0;background:rgba(22,23,28,.92);z-index:2;
  display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:20px}
.rail .tm{color:#E9ECF2;font-size:17px;font-weight:800}
.rail .ri{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;opacity:.5}
.rail .ri.on{background:rgba(52,211,153,.14);opacity:1;box-shadow:0 0 0 1px rgba(52,211,153,.35) inset}
.rail svg{width:19px;height:19px;stroke:#cfd6e2;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .ri.on svg{stroke:#34D399}
.page{position:absolute;left:66px;top:0;right:0;bottom:0;padding:18px 20px}
.page h3{margin:0;font-size:17px;color:#E9ECF2;font-weight:800}
.page .hint{font-size:11px;color:#6B7180;margin-top:5px}
.prow{display:flex;align-items:center;gap:11px;margin-top:15px;opacity:.45}
.prow .pic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06)}
.prow .pl{height:9px;border-radius:4px;background:rgba(255,255,255,.10);width:120px}
.prow .pl.s{width:70px;height:7px;margin-top:5px;background:rgba(255,255,255,.07)}
.prow .pt{margin-left:auto;width:34px;height:18px;border-radius:9px;background:rgba(52,211,153,.5)}
.dim{position:absolute;inset:0;left:66px;background:rgba(12,14,18,.66);z-index:3;border-radius:0 22px 22px 0}

/* 提醒卡 */
.alert{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);
  width:360px;height:172px;border-radius:16px;background:#1e2128;
  display:flex;flex-direction:column;align-items:center;padding-top:19px;
  animation:breathe 1.1s ease-in-out infinite}
.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(var(--r),var(--g),var(--b),.20)}
.ic svg{width:24px;height:24px;stroke:rgb(var(--r),var(--g),var(--b));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:19px;font-weight:800;color:#E9ECF2;margin-top:9px}
.s{font-size:11.5px;color:#969EAF;margin-top:5px}
.btns{display:flex;gap:12px;margin-top:15px}
.btn{height:34px;border-radius:10px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ghost{width:148px;background:transparent;border:1px solid rgba(255,255,255,.16);color:#E9ECF2}
.solid{width:148px;background:rgb(var(--r),var(--g),var(--b));color:#0b1a16}
.foot{font-size:9.5px;color:#6B7180;margin-top:9px}

@keyframes breathe{
  0%,100%{box-shadow:0 18px 44px -14px rgba(0,0,0,.7),
    0 0 18px -4px rgba(var(--r),var(--g),var(--b),.14),
    0 0 1px rgba(var(--r),var(--g),var(--b),.30);}
  50%{box-shadow:0 18px 44px -14px rgba(0,0,0,.7),
    0 0 50px 5px rgba(var(--r),var(--g),var(--b),.46),
    0 0 2px rgba(var(--r),var(--g),var(--b),.55);}
}

/* 收起态胶囊 */
.pillwrap{width:520px;margin-top:16px;display:flex;justify-content:center}
.pill{width:392px;height:62px;border-radius:0 0 20px 20px;background:linear-gradient(180deg,#20262f,#171c24);
  display:flex;align-items:center;gap:12px;padding:11px 13px 12px;
  border:1px solid rgba(var(--r),var(--g),var(--b),.32);
  animation:pillbreathe 1.1s ease-in-out infinite}
.pill .pc{width:38px;height:38px;border-radius:12px;background:rgba(var(--r),var(--g),var(--b),.20);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pill .pc svg{width:19px;height:19px;stroke:rgb(var(--r),var(--g),var(--b));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill .pm{flex:1;min-width:0}
.pill .pt1{font-size:13.5px;font-weight:800;color:#f2f6fc}
.pill .pt2{font-size:11px;color:#969EAF;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .pb{display:flex;gap:8px}
.pill .pbtn{height:24px;border-radius:8px;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px}
.pill .pghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:#E9ECF2}
.pill .psolid{background:rgb(var(--r),var(--g),var(--b));color:#08251d}
@keyframes pillbreathe{
  0%,100%{box-shadow:0 0 14px -2px rgba(var(--r),var(--g),var(--b),.14)}
  50%{box-shadow:0 0 34px 4px rgba(var(--r),var(--g),var(--b),.40)}
}

.note{margin-top:30px;background:#fbf8f1;border:1px solid #e4dccb;border-radius:18px;padding:20px 24px;max-width:840px}
.note h2{font-size:15.5px;margin:0 0 8px}
.note p{margin:0;font-size:13.5px;color:#5f594b;line-height:1.8}
</style>
</head>
<body>
<div class="eyebrow">WinIsle · Reminder</div>
<h1>健康提醒 · 柔光呼吸（快频版）</h1>
<div class="sub">采用 2 号「柔光呼吸」方案，把节奏从 3.2s 提到 <b>1.1s</b>，光晕走「模糊扩散 + 透明度」而非硬边抖动，三色分别对应久坐 / 喝水 / 护眼。下面是展开态提醒卡与收起态胶囊两组实景。</div>
<div class="badge">节奏 1.1s · 幅度 0.14 → 0.46 · 无硬边</div>

<div class="rows" id="rows"></div>

<div class="note">
  <h2>说明</h2>
  <p>三款只差颜色与文案，动效完全一致；这套参数就是准备落进真实应用的版本（把现在代码里“多层描边快速抖动”换成“单层模糊光晕呼吸 1.1s”）。你确认后我直接替换并出实机 GIF。</p>
</div>

<script>
const icons={
  sit:`<svg viewBox="0 0 24 24"><path d="M6 10V6.5h12V10M6 10h12M7.5 10v6M16.5 10v6M5 16h14"/></svg>`,
  water:`<svg viewBox="0 0 24 24"><path d="M12 3.2c3.4 4.1 6 7 6 10.2a6 6 0 1 1-12 0C6 10.2 8.6 7.3 12 3.2z"/></svg>`,
  eye:`<svg viewBox="0 0 24 24"><path d="M3.2 12s3.3-6 8.8-6 8.8 6 8.8 6-3.3 6-8.8 6S3.2 12 3.2 12z"/><circle cx="12" cy="12" r="2.7"/></svg>`
};
const rail={
  music:`<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>`,
  todo:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.6 2.6L16 9.4"/></svg>`,
  bell:`<svg viewBox="0 0 24 24"><path d="M6 16.5h12M8 16.5V11a4 4 0 0 1 8 0v5.5M10.5 19a1.7 1.7 0 0 0 3 0"/></svg>`,
  cloud:`<svg viewBox="0 0 24 24"><path d="M7 18h10a3.4 3.4 0 0 0 .3-6.8A5 5 0 0 0 7.6 10 3.9 3.9 0 0 0 7 18z"/></svg>`
};
const data=[
 {n:1,name:'久坐提醒',rgb:'230,178,60',hex:'#E6B23C',icon:'sit',tip:'该起来活动一下了',desc:'已连续久坐45分钟 · 起身走走',sub:'每 45 分钟 · 循环'},
 {n:2,name:'喝水提醒',rgb:'57,199,255',hex:'#39C7FF',icon:'water',tip:'喝水时间到',desc:'距上次喝水30分钟 · 起来喝口水',sub:'每 30 分钟 · 循环'},
 {n:3,name:'护眼提醒',rgb:'52,211,153',hex:'#34D399',icon:'eye',tip:'远眺一下，放松眼睛',desc:'用眼30分钟 · 远眺20秒',sub:'每 30 分钟 · 只提示一次'},
];
document.getElementById('rows').innerHTML=data.map(d=>`
  <div class="row" style="--r:${d.rgb.split(',')[0]};--g:${d.rgb.split(',')[1]};--b:${d.rgb.split(',')[2]}">
    <div class="meta">
      <div class="no">${d.n}</div>
      <h3>${d.name}</h3>
      <div class="d">${d.sub}</div>
      <div class="dot"><i style="background:${d.hex}"></i>${d.hex}</div>
      <div class="kv">动效：柔光呼吸 <b>1.1s</b><br>方式：模糊光晕透明度 0.14↔0.46</div>
    </div>
    <div>
      <div class="stage">
        <div class="rail">
          <div class="tm">20:34</div>
          <div class="ri">${rail.music}</div>
          <div class="ri">${rail.todo}</div>
          <div class="ri on">${rail.bell}</div>
          <div class="ri">${rail.cloud}</div>
        </div>
        <div class="page">
          <h3>提醒</h3>
          <div class="hint">开启后从现在开始计时 · 重新打开 WinIsle 会从启动时重新计时</div>
          <div class="prow"><div class="pic"></div><div><div class="pl"></div><div class="pl s"></div></div><div class="pt"></div></div>
          <div class="prow"><div class="pic"></div><div><div class="pl"></div><div class="pl s"></div></div><div class="pt"></div></div>
        </div>
        <div class="dim"></div>
        <div class="alert">
          <div class="ic">${icons[d.icon]}</div>
          <div class="t">${d.tip}</div>
          <div class="s">${d.desc}</div>
          <div class="btns"><div class="btn ghost">稍后 10 分钟</div><div class="btn solid">完成</div></div>
          <div class="foot">持续提醒中 · 完成后收起</div>
        </div>
      </div>
      <div class="pillwrap">
        <div class="pill">
          <div class="pc">${icons[d.icon]}</div>
          <div class="pm"><div class="pt1">${d.tip}</div><div class="pt2">${d.desc}</div></div>
          <div class="pb"><div class="pbtn pghost">稍后</div><div class="pbtn psolid">完成</div></div>
        </div>
      </div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
